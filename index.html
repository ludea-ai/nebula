<body>
  <!-- Home: full-screen splash + bottom sheet -->
  <div id="screen-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-hero">
      <img id="home-logo" class="home-logo hidden" alt="" draggable="false" />
      <h1 id="home-title" class="game-title">Game</h1>
      <p id="home-tagline" class="subtitle"></p>
    </div>
    <div class="home-sheet">
      <label id="home-name-label" class="field-label" for="place-name-input">Name your place:</label>
      <input id="place-name-input" type="text" maxlength="20" />
      <button id="btn-start" class="btn btn-giant btn-primary">New game</button>
      <button id="btn-continue" class="btn btn-giant btn-secondary">Continue</button>
      <p id="home-msg" class="home-msg"></p>
      <div class="home-foot">
        <button id="btn-refresh" class="btn-refresh" title="Clear cache and reload">Refresh</button>
        <span id="app-version" class="app-version"></span>
      </div>
    </div>
  </div>

  <!-- Character creation: carousel -->
  <div id="screen-create" class="screen hidden">
    <div class="home-bg"></div>
    <h2 id="create-title" class="create-title">Choose your character</h2>
    <div class="preview-wrap">
      <button id="car-prev" class="nav-arrow prev" aria-label="previous"></button>
      <div id="avatar-preview" class="avatar-preview"></div>
      <button id="car-next" class="nav-arrow next" aria-label="next"></button>
    </div>
    <div class="home-sheet create-sheet">
      <div id="create-controls" class="create-controls"></div>
      <button id="btn-create-ok" class="btn btn-giant btn-primary">Let's go!</button>
    </div>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen hidden">
    <header class="top-bar">
      <div class="bar-line">
        <div class="place-title"><span id="place-avatar" class="place-avatar"></span><span id="place-name" class="place-name">My place</span></div>
        <div class="hud-actions">
          <button id="btn-goals" class="mini-btn" title="Goals"></button>
          <button id="btn-me" class="mini-btn" title="Change my look"></button>
          <button id="btn-sound" class="mini-btn" title="Sound"></button>
          <button id="btn-help" class="mini-btn" title="Help"></button>
        </div>
      </div>
      <div id="hud-resources" class="resources"></div>
    </header>

    <div id="game-message" class="game-message hidden"></div>

    <div class="world-zone">
      <div id="world"></div>
      <button id="btn-action" class="btn-action hidden">Action</button>
    </div>

    <div id="panel" class="panel">
      <p class="panel-hint"></p>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="btn-close-modal" class="btn-close" aria-label="Close"></button>
      <h2 id="modal-title">Title</h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Close-up mini-scene (generic): zoom onto a backdrop and scrub spots off it -->
  <div id="closeup" class="closeup hidden">
    <button id="closeup-close" class="closeup-close" aria-label="Close"></button>
    <div id="closeup-stage" class="closeup-stage">
      <img id="closeup-bg" class="closeup-bg" alt="" draggable="false" />
      <img id="closeup-brush" class="closeup-brush hidden" alt="" draggable="false" />
    </div>
  </div>

  <!-- Night veil ("rest" transition), fullscreen -->
  <div id="night-veil"></div>

  <script src="vendor/phaser.min.js?v=v63"></script>
  <script src="game.config.js?v=v63"></script>
  <script src="game.i18n.js?v=v63"></script>
  <script src="engine.js?v=v63"></script>
</body>
</html>
